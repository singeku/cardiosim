<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a13"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>CardioSim</title>
<style>
:root{--bg:#060a13;--card:#0d1423;--line:#1b2640;--tx:#e8eefc;--mut:#7d8bad;--c:#34d399}
body.s0{--c:#38bdf8}body.s1{--c:#34d399}body.s2{--c:#fb7185}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(110% 55% at 50% -8%,color-mix(in srgb,var(--c) 24%,transparent),transparent 62%),var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
.w{max-width:460px;margin:auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
#chip{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
#dot{width:9px;height:9px;border-radius:50%;background:#64748b}
#chip.ok #dot{background:#34d399;box-shadow:0 0 8px #34d399}#chip.warn #dot{background:#fbbf24;animation:b 1s infinite}#chip.demo #dot{background:#a78bfa}
@keyframes b{50%{opacity:.25}}
.hero{display:flex;align-items:center;gap:14px}
#heart{width:62px;height:62px;fill:var(--c);filter:drop-shadow(0 0 14px var(--c));flex:none}
#heart.beat{animation:p .28s ease-out}
@keyframes p{30%{transform:scale(1.25)}}
#bpm{font-size:68px;font-weight:800;line-height:1;color:var(--c);text-shadow:0 0 28px color-mix(in srgb,var(--c) 55%,transparent);font-variant-numeric:tabular-nums}
.u{color:var(--mut);font-size:14px}#est{font-size:22px;font-weight:700}
.ecg{padding:6px 0;position:relative;background:linear-gradient(#ffffff08 1px,transparent 1px) 0 0/100% 25%,linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/8% 100%,var(--card)}
canvas{width:100%;height:170px;display:block;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%);mask-image:linear-gradient(90deg,transparent,#000 14%)}
.row{display:flex;align-items:center;gap:14px}
#pw{width:74px;height:74px;border-radius:50%;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-size:30px;cursor:pointer;box-shadow:0 0 22px color-mix(in srgb,var(--c) 40%,transparent);transition:.25s;flex:none}
#pw.off{border-color:#475569;color:#64748b;background:none;box-shadow:none}
input[type=range]{width:100%;-webkit-appearance:none;height:8px;border-radius:9px;background:var(--line);margin:14px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:0 0 16px var(--c)}
.sc{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.in{display:flex;gap:8px;margin-top:12px}
input[type=number]{flex:1;min-width:0;background:#0a1120;border:1px solid var(--line);border-radius:14px;color:var(--tx);font-size:18px;padding:12px 14px}
button{font:inherit}
.b{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--c);color:#04130d}
.g{background:#ffffff0d;color:var(--tx);font-weight:600}
.pre{display:flex;gap:8px;margin-top:12px}.pre .b{flex:1;padding:10px 4px;font-size:14px}
.cn{display:flex;gap:8px}.cn .b{flex:1}
#msg{font-size:13px;color:#fbbf24;text-align:center;min-height:1em}
#toff{color:var(--mut);font-size:13px;margin-top:2px}
.pane{display:flex;flex-direction:column;gap:12px}[hidden]{display:none!important}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:12px;font-weight:700;cursor:pointer;transition:.25s}
.tabs button.on{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.chip2{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.chip2 .d{width:9px;height:9px;border-radius:50%;background:#64748b}
.chip2.ok .d{background:#34d399;box-shadow:0 0 8px #34d399}.chip2.warn .d{background:#fbbf24;animation:b 1s infinite}
.ring{position:relative;width:132px;height:132px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}.ring .t{stroke:var(--line)}
.ring .p{stroke:var(--c);stroke-linecap:round;filter:drop-shadow(0 0 6px var(--c));transition:stroke-dashoffset .9s linear,stroke .4s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}
.ring i{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-style:normal;font-size:12px;color:var(--mut)}
.kv{flex:1;min-width:0}.kv .v{font-size:40px;font-weight:800;color:var(--c);line-height:1.1;text-shadow:0 0 22px color-mix(in srgb,var(--c) 50%,transparent)}
.kv .u{font-size:12px;text-transform:uppercase;letter-spacing:.7px}
#hm{width:40px;height:40px;fill:var(--c);filter:drop-shadow(0 0 10px var(--c));flex:none}#hm.beat{animation:p .28s ease-out}
</style></head><body class="s1"><div class="w">
<header><h1>CardioSim</h1><div id="chip"><span id="dot"></span><span id="ct">Sin conexión</span></div></header>
<div class="tabs"><button id="tS" class="on">Simulador</button><button id="tM">Monitor</button></div>


<div id="vm" class="pane" hidden>
 <div class="card row" style="gap:16px">
  <div class="ring"><svg viewBox="0 0 120 120" width="132" height="132"><circle class="t" cx="60" cy="60" r="52"/><circle class="p" id="rp" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><b id="mt">60</b><i>segundos</i></div>
  <div class="kv"><div class="u" id="ml">Pulsos contados</div><div class="v"><span id="mf">--</span> <span class="u" id="mu">pulsos</span></div>
   <div class="u" style="margin-top:10px">Diagnóstico</div><div id="md" style="font-size:22px;font-weight:700;color:var(--c)">Listo</div></div>
 </div>
 <div class="card row"><svg id="hm" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 2.7 4.5 6.4 4.5c2.2 0 3.8 1.3 5.6 3.4 1.8-2.1 3.4-3.4 5.6-3.4 3.7 0 5.5 3.8 4 7.2C19.5 16.4 12 21 12 21z"/></svg>
  <div style="flex:1"><b id="ms">Presiona START para medir</b><div class="u">Cuenta los pulsos durante 60 s</div></div>
  <button class="b" id="mst" style="padding:16px 22px;font-size:17px">▶ START</button></div>
</div>
<div class="card hero" id="vs">
 <svg id="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.300 2.700 4.500 6.400 4.500c2.200 0 3.800 1.300 5.600 3.400 1.800-2.100 3.400-3.400 5.600-3.400 3.700 0 5.500 3.800 4 7.200C19.500 16.400 12 21 12 21z"/></svg>
 <div><div><span id="bpm">--</span> <span class="u">ppm</span></div><div id="est">Apagado</div><div id="toff"></div></div>
</div>

<div class="card ecg"><canvas id="cv"></canvas></div>

<div class="card">
 <div class="row"><button id="pw" aria-label="Encender o apagar">⏻</button>
  <div style="flex:1"><b>Paciente simulado</b><div class="u" id="pwt">Apagado</div></div></div>
 <input type="range" id="rng" min="30" max="120" value="75">
 <div class="sc"><span>30 · Bradicardia</span><span>Normal</span><span>Taquicardia · 120</span></div>
 <div class="in"><input type="number" id="num" inputmode="numeric" min="30" max="120" placeholder="Escribe un valor (30–120)"><button class="b" id="go">Enviar</button></div>
 <div class="pre"><button class="b g" data-v="40">Brad. 40</button><button class="b g" data-v="75">Normal 75</button><button class="b g" data-v="120">Taqui 120</button></div>
</div>

<div class="cn"><button class="b" id="con">Conectar con el ESP32</button><button class="b g" id="dem">Modo demo</button></div>
<div id="msg"></div>
</div>

<script>
const SVC='4fafc201-1fb5-459e-8fcc-c5c9c331914b',ST='beb5483e-36e1-4688-b7f5-ea07361b26a8',CMD='beb5483e-36e1-4688-b7f5-ea07361b26a9';
const N=['Bradicardia','Normal','Taquicardia'],$=id=>document.getElementById(id);
let dev,chCmd,rx=0,demo=false,rc=false,beats=[],q=Promise.resolve(),lastSend=0,nextBeat=0,wl,tm;
const S={bpm:75,on:true};
const est=b=>b<60?0:b<=100?1:2;

function conn(cls,t){$('chip').className=cls;$('ct').textContent=t}
function ui(){const b=S.bpm;document.body.className='s'+est(b);
 $('bpm').textContent=S.on?b:'--';$('est').textContent=S.on?N[est(b)]:'Apagado';
 $('pw').classList.toggle('off',!S.on);$('pwt').textContent=S.on?'Encendido':'Apagado';
 $('rng').value=b;$('toff').textContent=S.on?`Toff ${Math.round(60000/b-250)} ms · pulso 250 ms`:''}
function setBpm(b){S.bpm=Math.max(30,Math.min(120,Math.round(b)));ui()}
function send(c){lastSend=performance.now();if(!chCmd)return;const d=new TextEncoder().encode(c);
 q=q.then(()=>(chCmd.writeValueWithoutResponse||chCmd.writeValue).call(chCmd,d)).catch(()=>{})}
function beat(){beats.push(performance.now()/1000);if(beats.length>40)beats.shift();
 for(const id of['heart','hm']){const h=$(id);h.classList.remove('beat');void h.getBoundingClientRect();h.classList.add('beat')}}

// ---------- Conexión Bluetooth LE robusta ----------
async function link(){const s=await dev.gatt.connect(),v=await s.getPrimaryService(SVC);
 const st=await v.getCharacteristic(ST);chCmd=await v.getCharacteristic(CMD);
 st.addEventListener('characteristicvaluechanged',onRx);await st.startNotifications();
 rx=performance.now();conn('ok','Conectado')}
async function reconnect(){if(rc||!dev)return;rc=true;conn('warn','Reconectando…');let w=700;
 while(dev){try{await link();break}catch(e){await new Promise(r=>setTimeout(r,w));w=Math.min(w*1.5,4000)}}rc=false}
function onRx(e){rx=performance.now();const m=new TextDecoder().decode(e.target.value);
 if(m==='P'){if(S.on)beat()}else if(m[0]==='S'){const[,b,o]=m.split(':');S.on=o==='1';
  if(performance.now()-lastSend>1500)S.bpm=+b;ui()}else if(m[0]==='M')monRx(m)}
async function connect(){$('msg').textContent='';
 if(!navigator.bluetooth){$('msg').textContent='Este navegador no soporta Bluetooth. Usa Chrome en Android (o Bluefy en iPhone).';return}
 try{dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]},{namePrefix:'CardioSim'}],optionalServices:[SVC]});demo=false;
  dev.addEventListener('gattserverdisconnected',reconnect);conn('warn','Conectando…');await link();keepAwake()}
 catch(e){conn('','Sin conexión');$('msg').textContent='No se pudo conectar. Enciende el ESP32, acércalo e inténtalo de nuevo.'}}
// Vigilante: si pasan 4 s sin noticias del ESP32, fuerza reconexión
setInterval(()=>{if(dev&&dev.gatt.connected&&performance.now()-rx>4000)dev.gatt.disconnect()},1000);
async function keepAwake(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(dev||demo))keepAwake()});

// ---------- Controles ----------
$('con').onclick=connect;
$('dem').onclick=()=>{demo=true;dev=null;chCmd=null;conn('demo','Modo demo');keepAwake();ui()};
$('pw').onclick=()=>{S.on=!S.on;ui();send(S.on?'ON':'OFF')};
$('rng').oninput=e=>{setBpm(+e.target.value);if(!tm)tm=setTimeout(()=>{tm=0;send('B:'+S.bpm)},70)};
$('rng').onchange=()=>send('B:'+S.bpm);
const go=()=>{const v=parseFloat($('num').value);if(isNaN(v))return;setBpm(v);send('B:'+S.bpm);$('num').value='';$('num').blur()};
$('go').onclick=go;$('num').onkeydown=e=>{if(e.key==='Enter')go()};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{setBpm(+b.dataset.v);send('B:'+S.bpm)});

// ---------- Electrocardiograma ----------
function tpl(t){const g=(a,c,w)=>a*Math.exp(-((t-c)**2)/(2*w*w));
 return g(.12,-.16,.04)+g(-.12,-.035,.012)+g(1,0,.014)+g(-.25,.035,.014)+g(.25,.24,.06)}
const cv=$('cv'),x=cv.getContext('2d');
function draw(){const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 if(cv.width!==w*r){cv.width=w*r;cv.height=h*r}x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,h);
 const now=performance.now()/1000,W=5,edge=now-.2;
 if(demo&&S.on&&now>=nextBeat){beat();nextBeat=now+60/S.bpm}
 x.lineWidth=2.5;x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--c');
 x.shadowColor=x.strokeStyle;x.shadowBlur=12;x.beginPath();
 for(let px=0;px<=w;px+=2){const t=edge-W+px/w*W;let y=0;
  if(S.on)for(const b of beats)if(Math.abs(t-b)<.5)y+=tpl(t-b);
  y=h*.68-y*h*.5+(S.on?Math.sin(t*90)*.6:0);px?x.lineTo(px,y):x.moveTo(px,y)}
 x.stroke();requestAnimationFrame(draw)}
/* ===== MONITOR (Proyecto 2): usa la MISMA conexión BLE del simulador ===== */
const M={est:0,seg:60,n:0,dx:-1,col:'#a78bfa'};let mode='s',tabT=0;
function monRx(m){const a=m.split(':');M.est=+a[1];M.seg=+a[2];M.n=+a[3];M.dx=+a[4];uiM();
 const t=+a[5]?'m':'s';if(t!==mode&&performance.now()-tabT>2500)tab(t,1)}
function uiM(){const{est,seg,n,dx}=M;M.col=est===2&&dx>=0?['#fbbf24','#34d399','#fb7185'][dx]:'#a78bfa';
 $('mt').textContent=est===2?0:seg;$('rp').style.strokeDashoffset=est===1?326.7*(1-seg/60):0;
 $('mf').textContent=est===0?'--':n;$('mu').textContent=est===2?'ppm':'pulsos';
 $('ml').textContent=est===2?'Frecuencia cardiaca':'Pulsos contados';
 $('md').textContent=est===2?N[dx]:est===1?'Midiendo…':'Listo';
 $('ms').textContent=est===0?'Presiona START para medir':est===1?'Midiendo, no interrumpas la señal':'Medición completa';
 if(mode==='m')document.body.style.setProperty('--c',M.col)}
function tab(m,fromDev){mode=m;$('vs').hidden=m!=='s';$('vm').hidden=m!=='m';
 $('tS').classList.toggle('on',m==='s');$('tM').classList.toggle('on',m==='m');
 if(m==='m')document.body.style.setProperty('--c',M.col);else document.body.style.removeProperty('--c');
 if(!fromDev){tabT=performance.now();send(m==='m'?'MODE:M':'MODE:S')}}
$('tS').onclick=()=>tab('s');$('tM').onclick=()=>tab('m');
$('mst').onclick=()=>{if(!chCmd){$('msg').textContent='Primero conecta el ESP32.';return}send('START')};
uiM();
ui();draw();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
